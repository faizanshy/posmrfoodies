<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Food POS & Thermal Billing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout */
        .sidebar {
            width: 350px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .main-content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: #0f172a;
        }

        /* Branding & Logo Section */
        .brand-section {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #00F90A;
            margin-bottom: 8px;
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00F90A;
        }

        /* Cart / Bill Section */
        .cart-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 15px;
            background: #0f172a;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #1e293b;
            font-size: 0.9rem;
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            background: #1e293b;
            padding: 12px;
            border-radius: 6px;
        }

        .btn-print {
            background-color: #00F90A;
            color: #000;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-print:hover {
            background-color: #00d408;
        }

        /* Menu Grid */
        .section-title {
            font-size: 1.4rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .menu-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .menu-card:hover {
            border-color: #00F90A;
            transform: translateY(-2px);
        }

        .menu-card h4 {
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .menu-card p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* Hidden Thermal Print Receipt Styles */
        #print-receipt {
            display: none;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #print-receipt, #print-receipt * {
                visibility: visible;
            }
            #print-receipt {
                display: block;
                position: absolute;
                left: 0;
                top: 0;
                width: 72mm; /* Standard Thermal Paper Width */
                font-family: 'Courier New', Courier, monospace;
                color: #000;
                background: #fff;
                padding: 5px;
            }
            .receipt-logo {
                display: block;
                margin: 0 auto 5px auto;
                max-width: 40px;
                max-height: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar / Billing Panel -->
    <div class="sidebar">
        <div class="brand-section">
            <!-- Yahan aap apna logo image link ya local path daal sakte hain -->
            <img src="https://via.placeholder.com/70" alt="Logo" class="brand-logo" id="logo-preview">
            <div class="brand-name">SMUN FAST FOOD</div>
            <input type="file" id="logo-input" accept="image/*" style="margin-top: 8px; font-size: 0.75rem; color: #94a3b8;">
        </div>

        <div class="cart-title">Current Order / Token</div>
        <div class="cart-items" id="cart-items-container">
            <!-- Items added dynamically -->
        </div>

        <div class="cart-total">
            <span>Total:</span>
            <span id="grand-total">Rs. 0</span>
        </div>

        <button class="btn-print" onclick="printReceipt()">Print Token & Bill</button>
    </div>

    <!-- Main Content / Fast Food Menu -->
    <div class="main-content">
        <div class="section-title">Fast Food Menu</div>
        <div class="menu-grid" id="menu-grid">
            <!-- Dynamic Menu Items -->
        </div>
    </div>

    <!-- Hidden Thermal Printer Layout (80mm / 58mm) -->
    <div id="print-receipt">
        <div style="text-align: center;">
            <img src="" id="receipt-logo-img" class="receipt-logo" style="display:none;">
            <h3 style="margin: 0; font-size: 14px;">SMUN FAST FOOD</h3>
            <p style="font-size: 10px; margin: 2px 0;">Token Slip # <span id="r-token">101</span></p>
            <p style="font-size: 10px; margin: 2px 0;" id="r-date"></p>
            <p style="border-bottom: 1px dashed #000; margin: 5px 0;"></p>
        </div>
        <table style="width: 100%; font-size: 11px; border-collapse: collapse;">
            <thead>
                <tr style="border-bottom: 1px dashed #000;">
                    <th style="text-align: left;">Item</th>
                    <th style="text-align: center;">Qty</th>
                    <th style="text-align: right;">Price</th>
                </tr>
            </thead>
            <tbody id="receipt-items-body">
                <!-- Print items injected here -->
            </tbody>
        </table>
        <p style="border-bottom: 1px dashed #000; margin: 5px 0;"></p>
        <div style="font-size: 12px; font-weight: bold; display: flex; justify-content: space-between;">
            <span>TOTAL:</span>
            <span id="r-total">Rs. 0</span>
        </div>
        <div style="text-align: center; font-size: 10px; margin-top: 10px;">
            <p>Thank you for visiting!</p>
            <p>Powered by Smundrinks POS</p>
        </div>
    </div>

    <script>
        // Fast Food Menu Data
        const menuItems = [
            { id: 1, name: "Zinger Burger", price: 450 },
            { id: 2, name: "Chicken Burger", price: 300 },
            { id: 3, name: "Large Pizza", price: 1200 },
            { id: 4, name: "French Fries", price: 180 },
            { id: 5, name: "Cold Drink (500ml)", price: 120 },
            { id: 6, name: "Hot Wings (6 pcs)", price: 350 },
            { id: 7, name: "Zinger Roll", price: 280 }
        ];

        let cart = [];
        let tokenNumber = 101;

        // Render Menu Items
        const menuGrid = document.getElementById('menu-grid');
        menuItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'menu-card';
            card.innerHTML = `
                <h4>${item.name}</h4>
                <p>Rs. ${item.price}</p>
            `;
            card.onclick = () => addToCart(item);
            menuGrid.appendChild(card);
        });

        // Add to Cart Logic
        function addToCart(item) {
            const existing = cart.find(cartItem => cartItem.id === item.id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateCartUI();
        }

        // Update Cart UI
        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = '<p style="color: #64748b; text-align: center; margin-top: 20px;">No items selected</p>';
                document.getElementById('grand-total').innerText = 'Rs. 0';
                return;
            }

            cart.forEach(item => {
                total += item.price * item.qty;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <span>${item.name} x${item.qty}</span>
                    <span>Rs. ${item.price * item.qty}</span>
                `;
                container.appendChild(div);
            });

            document.getElementById('grand-total').innerText = `Rs. ${total}`;
        }

        // Logo Upload Handler
        document.getElementById('logo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('logo-preview').src = event.target.result;
                    document.getElementById('receipt-logo-img').src = event.target.result;
                    document.getElementById('receipt-logo-img').style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        // Print Receipt Function
        function printReceipt() {
            if (cart.length === 0) {
                alert('Pehle kuch items select karein!');
                return;
            }

            // Populate thermal receipt container
            const rBody = document.getElementById('receipt-items-body');
            rBody.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price * item.qty;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.name}</td>
                    <td style="text-align: center;">${item.qty}</td>
                    <td style="text-align: right;">${item.price * item.qty}</td>
                `;
                rBody.appendChild(tr);
            });

            document.getElementById('r-total').innerText = `Rs. ${total}`;
            document.getElementById('r-token').innerText = tokenNumber;
            
            const now = new Date();
            document.getElementById('r-date').innerText = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();

            // Trigger window print dialog (Sends directly to thermal printer if set as default)
            window.print();

            // Increment Token Number for next customer
            tokenNumber++;
            cart = [];
            updateCartUI();
        }
    </script>
</body>
</html>
